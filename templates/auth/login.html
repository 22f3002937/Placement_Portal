{% extends "base.html" %}
{% block content %}

<style>
    .login-container {
        max-width: 420px;
        margin: 60px auto;
        padding: 35px;
        background-color: #ffffff;
        border-radius: 10px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
    }

    .login-container h3 {
        text-align: center;
        margin-bottom: 25px;
        font-weight: 600;
        color: #333;
    }

    .login-container label {
        font-weight: 500;
        margin-bottom: 6px;
        display: block;
        color: #444;
    }

    .login-container input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        transition: border 0.3s ease, box-shadow 0.3s ease;
    }

    .login-container input:focus {
        border-color: #28a745;
        box-shadow: 0 0 5px rgba(40, 167, 69, 0.3);
        outline: none;
    }

    .login-container .btn-success {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border-radius: 6px;
        font-weight: 500;
        transition: background 0.3s ease;
    }

    .login-container .btn-success:hover {
        background-color: #218838;
    }

    .back-btn {
        text-align: center;
        margin-top: 15px;
    }

    .back-btn .btn {
        padding: 8px 18px;
        border-radius: 6px;
    }
</style>

<div class="login-container">
    <h3>Login</h3>

    <form method="POST">
        {{ form.hidden_tag() }}

        <div class="mb-3">
            {{ form.email.label }}
            {{ form.email(class="form-control") }}
        </div>

        <div class="mb-3">
            {{ form.password.label }}
            {{ form.password(class="form-control") }}
        </div>

        {{ form.submit(class="btn btn-success") }}
    </form>

    <div class="back-btn">
        <a href="{{url_for('index')}}" class="btn btn-secondary">Back</a>
    </div>
</div>

{% endblock %}

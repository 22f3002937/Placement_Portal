{% extends "base.html" %}
{% block content %}

<style>
    .dashboard-container {
        max-width: 1100px;
        margin: 50px auto;
        padding: 30px;
        background-color: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
    }

    .dashboard-container h3 {
        margin-bottom: 20px;
        font-weight: 600;
        color: #2c3e50;
    }

    .status-box {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 6px;
        font-weight: 500;
        margin-bottom: 20px;
    }

    .status-approved {
        background-color: #e6f4ea;
        color: #28a745;
    }

    .status-pending {
        background-color: #fff3cd;
        color: #856404;
    }

    .status-rejected {
        background-color: #f8d7da;
        color: #721c24;
    }

    .create-btn {
        display: inline-block;
        margin-bottom: 25px;
        padding: 8px 18px;
        border-radius: 6px;
        text-decoration: none;
        background-color: #007bff;
        color: #fff;
        font-weight: 500;
        transition: background 0.3s ease;
    }

    .create-btn:hover {
        background-color: #0056b3;
    }

    .custom-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
        font-size: 14px;
    }

    .custom-table th,
    .custom-table td {
        padding: 12px 10px;
        border: 1px solid #e0e0e0;
        text-align: left;
    }

    .custom-table th {
        background-color: #f4f6f9;
        font-weight: 600;
        color: #333;
    }

    .custom-table tbody tr:nth-child(even) {
        background-color: #fafafa;
    }

    .custom-table tbody tr:hover {
        background-color: #f1f5ff;
    }

    .view-btn {
        padding: 5px 12px;
        border-radius: 4px;
        text-decoration: none;
        background-color: #17a2b8;
        color: #fff;
        font-size: 12px;
        font-weight: 500;
    }

    .view-btn:hover {
        background-color: #138496;
    }

    .logout-link {
        display: inline-block;
        margin-top: 25px;
        color: #dc3545;
        text-decoration: none;
        font-weight: 500;
    }

    .logout-link:hover {
        text-decoration: underline;
    }
</style>

<div class="dashboard-container">

    <h3>Company Dashboard</h3>
    <a href="{{url_for('company_profile')}}" class="btn btn-primary">View
        profile</a>

    <div class="
        status-box
        {% if company.approval_status == 'approved' %}
            status-approved
        {% elif company.approval_status == 'pending' %}
            status-pending
        {% else %}
            status-rejected
        {% endif %}
    ">
        Status: {{ company.approval_status }}
    </div>

    <br>

    <a href="{{ url_for('create_drive') }}" class="create-btn">
        Create Drive
    </a>

    <hr>

    <h5>Your Drives</h5>

    <table class="custom-table">
        <tr>
            <th>Job Title</th>
            <th>Drive Status</th>
            <th>Actions</th>
        </tr>

        {% for drive in drives %}
        <tr>
            <td>{{ drive.job_title }}</td>
            <td>{{ drive.status }}</td>
            <td>
                <a href="{{ url_for('view_applications', drive_id=drive.id) }}"
                    class="view-btn">
                    View Applications
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>

    <div>
        <a href="{{ url_for('logout') }}" class="logout-link">Logout</a>
    </div>

</div>

{% endblock %}
